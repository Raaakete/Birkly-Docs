<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title desc">
  <title id="title">birkly-region header pattern</title>
  <desc id="desc">One-line birkly-region for site_elements header and child HTML override.</desc>
  <defs>
    <style>
      .bg { fill: #f7f6f3; }
      .card { fill: #fff; stroke: #d8d4cc; stroke-width: 1.5; }
      .label { font: 700 15px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1c1b19; }
      .code { font: 12.5px "IBM Plex Mono", ui-monospace, monospace; fill: #1c1b19; }
      .muted { font: 11px "IBM Plex Sans", sans-serif; fill: #6e695f; }
      .sub { font: 600 12px "IBM Plex Sans", sans-serif; fill: #5c574e; }
    </style>
  </defs>
  <rect class="bg" width="840" height="320"/>
  <text x="28" y="34" class="label">Regions  &lt;birkly-region&gt;</text>

  <rect class="card" x="24" y="60" width="792" height="90" rx="10"/>
  <text x="44" y="88" class="sub">One-line entry region</text>
  <text x="44" y="118" class="code">&lt;birkly-region collection="site_elements" entry="header"&gt;&lt;/birkly-region&gt;</text>

  <rect class="card" x="24" y="168" width="792" height="110" rx="10"/>
  <text x="44" y="196" class="sub">Child HTML override + list ordering</text>
  <text x="44" y="226" class="code">&lt;birkly-region collection="blog" list ordered="newest"&gt;</text>
  <text x="44" y="248" class="code">  &lt;article&gt;&lt;h2&gt;{title}&lt;/h2&gt;&lt;/article&gt;</text>
  <text x="44" y="270" class="code">&lt;/birkly-region&gt;</text>

  <text x="28" y="305" class="muted">ordered="newest|oldest|last-updated|order"  not date:desc. Enhance-only: never wipe innerHTML of CMS regions.</text>
</svg>
