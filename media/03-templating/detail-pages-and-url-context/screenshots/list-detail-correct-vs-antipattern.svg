<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">Detail page: correct URL context vs looping the collection</title>
<desc id="desc">Side-by-side comparison of wrong detail loop and correct single-entry markup</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#2f5d4a"/>
  </marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7f5ef"/>
    <stop offset="100%" stop-color="#efebe2"/>
  </linearGradient>
</defs>
<rect width="920" height="420" fill="url(#bg)"/>
<text x="40" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2a24">Detail pages: list loop vs URL context</text>
<text x="40" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#5c665f">List links use ?collection=&amp;slug= — the detail page must not wrap the body in a collection loop.</text>

  <rect x="40" y="80" width="400" height="300" rx="8" fill="#fbfaf7" stroke="#c5c0b4" stroke-width="1.5"/>
  <rect x="40" y="80" width="400" height="32" rx="8" fill="#ebe6db"/>
  <rect x="40" y="100" width="400" height="12" fill="#ebe6db"/>
  <text x="54" y="101" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#1f2a24">Anti-pattern (wrong)</text>

  <rect x="54" y="122" width="72" height="24" rx="4" fill="#f3e8e6" stroke="#8a4538" stroke-width="1.5"/>
  <text x="90" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#6b3228">Avoid</text>
<rect x="54" y="160" width="372" height="190" rx="6" fill="#f7f4ed" stroke="#c5c0b4"/>
<text x="68" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;!-- detail.html — WRONG --&gt;</text>
<text x="68" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{for each entry in 'blog'}</text>
<text x="68" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  &lt;h1&gt;{title}&lt;/h1&gt;</text>
<text x="68" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  &lt;div&gt;{'content'}&lt;/div&gt;</text>
<text x="68" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{endfor}</text>
<text x="68" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24"></text>
<text x="68" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">Always shows a list / wrong item</text>

  <rect x="480" y="80" width="400" height="300" rx="8" fill="#fbfaf7" stroke="#c5c0b4" stroke-width="1.5"/>
  <rect x="480" y="80" width="400" height="32" rx="8" fill="#ebe6db"/>
  <rect x="480" y="100" width="400" height="12" fill="#ebe6db"/>
  <text x="494" y="101" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#1f2a24">Correct pattern</text>

  <rect x="494" y="122" width="78" height="24" rx="4" fill="#e8f0ea" stroke="#3d6b4f" stroke-width="1.5"/>
  <text x="533" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#2a4f38">Correct</text>
<rect x="494" y="160" width="372" height="190" rx="6" fill="#f7f4ed" stroke="#c5c0b4"/>
<text x="508" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;!-- post.html?collection=blog&amp;slug=… --&gt;</text>
<text x="508" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;meta name=&quot;birkly-collection&quot; content=&quot;blog&quot;&gt;</text>
<text x="508" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;h1&gt;{title}&lt;/h1&gt;</text>
<text x="508" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;div&gt;{'content'}&lt;/div&gt;</text>
<text x="508" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">&lt;script src=&quot;/birkly-client.js&quot;&gt;&lt;/script&gt;</text>
<text x="508" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24"></text>
<text x="508" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">Reads the current entry from the URL</text>
</svg>