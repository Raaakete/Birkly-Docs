<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">Client render pipeline</title>
<desc id="desc">HTML templates to client to API page_bundle to rendered DOM</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#2f5d4a"/>
  </marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7f5ef"/>
    <stop offset="100%" stop-color="#efebe2"/>
  </linearGradient>
</defs>
<rect width="900" height="280" fill="url(#bg)"/>
<text x="36" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2a24">Client pipeline</text>
<text x="36" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#5c665f">HTML with {…} → birkly-client.js → public API / page_bundle → filled DOM</text>

  <rect x="60" y="100" width="150" height="100" rx="10" fill="#fbfaf7" stroke="#2f5d4a" stroke-width="2"/>
  <text x="135" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">HTML</text>
  <text x="135" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">templates</text>
  <path d="M218 150 L262 150" stroke="#2f5d4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="270" y="100" width="150" height="100" rx="10" fill="#fbfaf7" stroke="#2f5d4a" stroke-width="2"/>
  <text x="345" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">birkly-</text>
  <text x="345" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">client.js</text>
  <path d="M428 150 L472 150" stroke="#2f5d4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="100" width="150" height="100" rx="10" fill="#fbfaf7" stroke="#2f5d4a" stroke-width="2"/>
  <text x="555" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">API /</text>
  <text x="555" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">page_bundle</text>
  <path d="M638 150 L682 150" stroke="#2f5d4a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="690" y="100" width="150" height="100" rx="10" fill="#fbfaf7" stroke="#2f5d4a" stroke-width="2"/>
  <text x="765" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">Rendered</text>
  <text x="765" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f2a24">DOM</text>
  
<text x="60" y="240" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c665f">DevTools → Network: look for page_bundle / public collection requests after the script runs.</text>
</svg>