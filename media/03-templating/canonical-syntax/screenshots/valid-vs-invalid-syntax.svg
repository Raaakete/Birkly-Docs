<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
<title id="title">Valid Birkly syntax versus invalid Jinja-style syntax</title>
<desc id="desc">Single braces and plain English versus double braces and Jinja</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#2f5d4a"/>
  </marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7f5ef"/>
    <stop offset="100%" stop-color="#efebe2"/>
  </linearGradient>
</defs>
<rect width="920" height="400" fill="url(#bg)"/>
<text x="36" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2a24">Canonical syntax: valid vs invalid</text>
<text x="36" y="56" font-family="system-ui, sans-serif" font-size="13" fill="#5c665f">Single braces + plain English. No Jinja, Liquid, or Blade.</text>

  <rect x="36" y="78" width="420" height="290" rx="8" fill="#fbfaf7" stroke="#c5c0b4" stroke-width="1.5"/>
  <rect x="36" y="78" width="420" height="32" rx="8" fill="#ebe6db"/>
  <rect x="36" y="98" width="420" height="12" fill="#ebe6db"/>
  <text x="50" y="99" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#1f2a24">Valid (Birkly)</text>

  <rect x="50" y="122" width="70" height="24" rx="4" fill="#e8f0ea" stroke="#3d6b4f" stroke-width="1.5"/>
  <text x="85" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#2a4f38">Valid</text>
<rect x="50" y="158" width="392" height="184" rx="6" fill="#f7f4ed" stroke="#c5c0b4"/>
<text x="64" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{for each entry in 'blog'</text>
<text x="64" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  with status = published</text>
<text x="64" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  ordered by newest}</text>
<text x="64" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  &lt;h2&gt;{title}&lt;/h2&gt;</text>
<text x="64" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  &lt;p&gt;{'excerpt'}&lt;/p&gt;</text>
<text x="64" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{endfor}</text>

  <rect x="480" y="78" width="404" height="290" rx="8" fill="#fbfaf7" stroke="#c5c0b4" stroke-width="1.5"/>
  <rect x="480" y="78" width="404" height="32" rx="8" fill="#ebe6db"/>
  <rect x="480" y="98" width="404" height="12" fill="#ebe6db"/>
  <text x="494" y="99" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#1f2a24">Invalid (phantoms)</text>

  <rect x="494" y="122" width="78" height="24" rx="4" fill="#f3e8e6" stroke="#8a4538" stroke-width="1.5"/>
  <text x="533" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#6b3228">Invalid</text>
<rect x="494" y="158" width="376" height="184" rx="6" fill="#f7f4ed" stroke="#c5c0b4"/>
<text x="508" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{% for item in items %}</text>
<text x="508" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">  {{ item.title }}</text>
<text x="508" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{% endfor %}</text>
<text x="508" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24"></text>
<text x="508" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{title truncate 80}</text>
<text x="508" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2a24">{entry 'blog'.'slug'}…{endentry}</text>
</svg>